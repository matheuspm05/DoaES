services:
  - type: web
    name: doaes-api
    runtime: node
    plan: free
    branch: main
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_API_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: API_RATE_LIMIT
        value: "600"
